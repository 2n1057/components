<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morph Loading</title>
<style>
  :root { --bg: #ffffff; --fg: #000000; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e0e10; --fg: #ffffff; } }
  :root[data-theme="dark"] { --bg: #0e0e10; --fg: #ffffff; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body { margin: 0; height: 100%; background: var(--bg); }

  /* variant="morph" size="lg" className="w-full h-full" */
  .loader { position: relative; width: 100%; height: 100%; }
  .inner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .sq { position: absolute; width: 1rem; height: 1rem; background: var(--fg); }

  @keyframes morph-0 {
    0%,100% { transform: translate(0, 0) scale(1); border-radius: 0%; }
    25% { transform: translate(20px, -20px) scale(1.2); border-radius: 50%; }
    50% { transform: translate(40px, 0) scale(0.8); border-radius: 25%; }
    75% { transform: translate(20px, 20px) scale(1.1); border-radius: 75%; }
  }
  @keyframes morph-1 {
    0%,100% { transform: translate(0, 0) scale(1) rotate(0deg); border-radius: 0%; }
    25% { transform: translate(-20px, -20px) scale(1.3) rotate(90deg); border-radius: 50%; }
    50% { transform: translate(-40px, 0) scale(0.7) rotate(180deg); border-radius: 25%; }
    75% { transform: translate(-20px, 20px) scale(1.2) rotate(270deg); border-radius: 75%; }
  }
  @keyframes morph-2 {
    0%,100% { transform: translate(0, 0) scale(1); border-radius: 0%; }
    25% { transform: translate(-20px, 20px) scale(0.9); border-radius: 100%; }
    50% { transform: translate(0, 40px) scale(1.4); border-radius: 0%; }
    75% { transform: translate(20px, 20px) scale(0.8); border-radius: 50%; }
  }
  @keyframes morph-3 {
    0%,100% { transform: translate(0, 0) scale(1) rotate(0deg); border-radius: 0%; }
    25% { transform: translate(20px, 20px) scale(1.1) rotate(-90deg); border-radius: 25%; }
    50% { transform: translate(0, -40px) scale(1.3) rotate(-180deg); border-radius: 100%; }
    75% { transform: translate(-20px, -20px) scale(0.9) rotate(-270deg); border-radius: 75%; }
  }
</style>
</head>
<body>
  <div class="loader">
    <div class="inner">
        <div class="sq" style="animation: morph-0 2s infinite ease-in-out; animation-delay: 0s;"></div>
        <div class="sq" style="animation: morph-1 2s infinite ease-in-out; animation-delay: 0.2s;"></div>
        <div class="sq" style="animation: morph-2 2s infinite ease-in-out; animation-delay: 0.4s;"></div>
        <div class="sq" style="animation: morph-3 2s infinite ease-in-out; animation-delay: 0.6s;"></div>
    </div>
  </div>
</body>
</html>
